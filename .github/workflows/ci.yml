name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit tests
        run: npm test

      - name: Validate JSON (manifest + package)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Syntax-check scripts
        run: |
          for f in app.js lib.js quotes.js idb.min.js service-worker.js; do
            node --check "$f" && echo "OK $f"
          done

      - name: Verify icon generator runs and emits valid PNGs
        run: |
          node tools/gen-icons.mjs
          for f in icons/icon-192.png icons/icon-512.png icons/icon-192-maskable.png icons/icon-512-maskable.png; do
            test -s "$f" || (echo "::error::missing $f" && exit 1)
            head -c8 "$f" | od -An -tx1 | grep -qi "89 50 4e 47" || (echo "::error::$f not a PNG" && exit 1)
          done
          echo "icons OK"
